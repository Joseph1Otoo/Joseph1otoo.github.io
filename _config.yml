# Site settings
title: Joseph Otoo
tagline: Speaking through data for the common good
description: >-
  Research and analysis at the intersection of statistics, public health,
  and economics — with a focus on Ghana and the wider African context.

# This is a *user* site (Joseph1Otoo.github.io), not a project site, so baseurl
# must stay empty. A non-empty value prefixes every stylesheet and internal link
# with a path segment that does not exist.
baseurl: ""
url: "https://joseph1otoo.github.io"

# Must be a plain string, not a name/email mapping. Minima 2.5's footer does
# `{{ site.author | escape }}`, so a mapping gets stringified onto the page as
# a literal Ruby hash. jekyll-seo-tag accepts a string here too.
author: Joseph Otoo

email: joseph1otoo@gmail.com
github_username: Joseph1Otoo
twitter_username: JosephO24211417
scholar_url: "https://scholar.google.com/citations?user=Z6p6u-8AAAAJ&hl=en"
orcid: "0000-0002-3364-2857"
orcid_url: "https://orcid.org/0000-0002-3364-2857"

# Build settings
theme: minima

# Navigation. Minima 2.5 reads `header_pages` at the top level — `minima.skin`
# and `minima.nav_pages` are minima 3.x keys and are silently ignored here,
# which is why the nav previously fell back to listing every page including the
# homepage. Order below is the order shown.
header_pages:
  - insights.md
  - research.md
  - publications.md
  - about.markdown

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
# NOTE: jekyll-feed is absent here, but that does NOT disable it. Minima
# declares jekyll-feed as a gemspec runtime dependency and Jekyll auto-requires
# a theme's runtime deps, so the plugin loads and generates /feed.xml anyway.
# RSS is suppressed in three places instead:
#   1. .github/workflows/pages.yml — `rm -f _site/feed.xml` after the build
#   2. _includes/head.html         — drops minima's feed-meta autodiscovery link
#   3. index.markdown              — uses `page`, not minima's `home` layout,
#                                    which hardcodes a "subscribe via RSS" link
# Undo all three to bring RSS back.

permalink: /blog/:year/:month/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Joseph Otoo

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .jekyll-cache
  # CV source PDFs. These contain Joseph's phone number and postal address, and
  # referees' names, direct emails and personal mobile numbers. Jekyll copies
  # any unexcluded root file into _site verbatim, which would publish them at
  # joseph1otoo.github.io/CV_Academic_JO.pdf and friends. Keep them excluded.
  # If a CV is ever to go on the site, publish a redacted copy under /assets/
  # with referee details and personal contact information removed.
  - "CV_*.pdf"
  # Concatenated full text of Joseph's papers, used as a working reference for
  # building the publication list. Several are publisher-copyrighted (the
  # Hexpo paper is the Elsevier typeset version). A .md file with no front
  # matter is copied into _site verbatim, which would republish them.
  - All_Publications.md
