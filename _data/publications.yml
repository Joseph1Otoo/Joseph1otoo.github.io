# Publication list. The Publications page renders straight from this file, so
# adding a paper means adding an entry here — no HTML to touch.
#
# Sorted into year groups (descending) automatically; order in this file does
# not matter.
#
# Fields: `title` and `year` are required. Everything else is optional and is
# omitted from the rendering if absent.
#   authors  — full author string; wrap Joseph's name in ** ** to bold it.
#   venue    — journal or repository name.
#   volume   — volume/issue/pages.
#   type     — journal | preprint | conference | chapter | working-paper
#   doi/url  — links. `url` wraps the title; `doi` renders a separate link.
#   note     — one line of context, shown in italics.
#
# AUTHOR LISTS ARE TAKEN FROM THE PAPERS THEMSELVES (All_Publications.md,
# read 2026-07-15), not from Google Scholar and not from the CVs. Both of
# those were wrong in systematic ways:
#
#   * Scholar mangles every SciencePG / ARRB paper, which print author names
#     surname-first ("Bosson-Amedenu Senyefia"). Scholar reads the last token
#     as the surname and emits "BA Senyefia". The correct form is
#     "Bosson-Amedenu, S." Same for Eyiah-Bediako, Nyarko, Osei-Asibey,
#     Oduro-Okyireh, Okanta-Dade and Otoo himself ("O Joseph").
#   * The CVs compress long author lists to surface Joseph's name early
#     ("Azunre, P., Osei, S., Otoo, J., et al."), which on a publications page
#     would read as a claim to third authorship. He is 21st of 27 on those.
#
# Verified from the source PDFs. Where a name below differs from Scholar, the
# paper is the authority.
#
# Every author list below is now verified. Fifteen came from the paper PDFs;
# the hepatitis B list was confirmed by Joseph on 2026-07-15 and independently
# matches both Scholar and all four CVs.
#
