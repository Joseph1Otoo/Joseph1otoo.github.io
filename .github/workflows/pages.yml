name: Build and deploy site

# Builds on every branch so a push can be verified without touching the live
# site. Only gh-pages deploys — see the `if` on the deploy job.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # No Gemfile.lock is committed, so let bundler resolve fresh. Once a
          # lock is generated and committed, this can become `bundler-cache: true`
          # for faster builds.
          bundler-cache: false

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      # No actions/configure-pages here: it queries the Pages API and fails when
      # the Pages source is not yet set to "GitHub Actions", which would break
      # branch builds for an unrelated reason. This is a user site, so baseurl
      # is empty (set in _config.yml) and no base_path injection is needed.
      - name: Build
        run: |
          bundle exec jekyll build --trace

          # minima declares jekyll-feed as a gemspec runtime dependency, and
          # Jekyll auto-requires a theme's runtime deps (PluginManager
          # #require_theme_deps). So the plugin loads and generates /feed.xml
          # even though it is in neither `plugins:` nor the Gemfile — removing
          # it from config is not enough. Delete the artifact instead.
          # The autodiscovery <link> is handled separately in _includes/head.html.
          rm -f _site/feed.xml
        env:
          JEKYLL_ENV: production

      # Assertions use explicit if/then rather than `cmd && { exit 1; }`.
      # Actions runs steps under `bash -e -o pipefail`, where an && list whose
      # left side fails returns non-zero — which can fail the step even when the
      # check passed. Collect failures and report them all at once.
      - name: Check the build actually produced what we expect
        run: |
          fail=0
          note() { echo "FAIL: $1"; fail=1; }

          echo "--- _site ---"
          find _site -type f | sort

          echo
          echo "--- publications: does the Liquid render? ---"
          if [ ! -f _site/publications/index.html ]; then
            note "publications page missing"
          else
            count=$(grep -c '<li class="pub"' _site/publications/index.html || true)
            echo "publication entries rendered: $count"
            [ "$count" -eq 16 ] || note "expected 16 publication entries, got $count"
            if grep -q '{%\|{{' _site/publications/index.html; then
              note "raw Liquid leaked into rendered output"
            fi
          fi

          echo
          echo "--- custom CSS ---"
          echo "minima links /assets/main.css and nothing else, so our styles only"
          echo "ship if they land in THAT file (assets/main.scss, not elsewhere)."
          if grep -q '\.pub-title' _site/assets/main.css; then
            echo "OK: custom rules present in main.css"
          else
            note "custom CSS missing from main.css"
          fi

          echo
          echo "--- nav ---"
          echo "header_pages is the minima 2.5 key; minima.nav_pages is 3.x and is"
          echo "silently ignored, which previously let the homepage into the menu."
          [ -f _site/insights/index.html ] || note "insights page missing"
          # writing.md was renamed to insights.md; a leftover source file would
          # silently keep serving a duplicate page at /writing/.
          if [ -f _site/writing/index.html ]; then
            note "stale /writing/ page still built — delete writing.md"
          fi
          nav=$(grep -o 'class="page-link"[^>]*>[^<]*' _site/index.html | sed 's/.*>//' | tr -d ' ' | paste -sd, - || true)
          echo "nav items: $nav"
          case "$nav" in
            *JosephOtoo*) note "homepage leaked back into the nav" ;;
          esac

          echo
          echo "--- RSS should be gone entirely ---"
          echo "jekyll-feed cannot be switched off via config: minima declares it"
          echo "as a gemspec runtime dependency and Jekyll auto-requires those."
          echo "So the Build step deletes _site/feed.xml, head.html drops the"
          echo "autodiscovery link, and index.markdown avoids minima's home layout."
          if [ -f _site/feed.xml ]; then
            note "feed.xml is still being generated"
          fi
          if grep -q 'application/atom' _site/index.html; then
            note "feed autodiscovery still present in <head>"
          fi
          # minima's `home` layout hardcodes a "subscribe via RSS" link to
          # /feed.xml. index.markdown uses `page` to avoid it; catch a regression.
          if grep -rq 'rss-subscribe\|via RSS' _site --include='*.html'; then
            note "a 'subscribe via RSS' link is still rendered somewhere"
          fi

          echo
          if [ "$fail" -eq 0 ]; then
            echo "all checks passed"
          fi
          exit $fail

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/gh-pages'

  deploy:
    needs: build
    # Only the live branch publishes. Branch and PR builds stop at `build`.
    if: github.ref == 'refs/heads/gh-pages' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
