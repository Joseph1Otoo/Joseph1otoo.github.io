name: Build and deploy site

# Builds on every branch so a push can be verified without touching the live
# site. Only gh-pages deploys — see the `if` on the deploy job.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # No Gemfile.lock is committed, so let bundler resolve fresh. Once a
          # lock is generated and committed, this can become `bundler-cache: true`
          # for faster builds.
          bundler-cache: false

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      # No actions/configure-pages here: it queries the Pages API and fails when
      # the Pages source is not yet set to "GitHub Actions", which would break
      # branch builds for an unrelated reason. This is a user site, so baseurl
      # is empty (set in _config.yml) and no base_path injection is needed.
      - name: Build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Check the build actually produced what we expect
        run: |
          echo "--- _site ---"
          find _site -type f | sort
          echo
          echo "--- publications: does the Liquid render? ---"
          test -f _site/publications/index.html || { echo "MISSING publications page"; exit 1; }
          count=$(grep -c '<li class="pub"' _site/publications/index.html)
          echo "publication entries rendered: $count"
          test "$count" -eq 16 || { echo "EXPECTED 16 entries, got $count"; exit 1; }
          grep -q '{%\|{{' _site/publications/index.html && { echo "raw Liquid leaked into output"; exit 1; }
          echo
          echo "--- custom CSS: minima links /assets/main.css and nothing else, so ---"
          echo "--- our styles only ship if they land in THAT file.               ---"
          grep -q '\.pub-title' _site/assets/main.css || { echo "custom CSS missing from main.css"; exit 1; }
          echo "custom rules present in main.css"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/gh-pages'

  deploy:
    needs: build
    # Only the live branch publishes. Branch and PR builds stop at `build`.
    if: github.ref == 'refs/heads/gh-pages' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
